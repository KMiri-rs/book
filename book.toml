[book]
src = "src"
title = "KMiri Book"

[build]
build-dir = "public"

[output.html]
default-theme = "light"
git-repository-url = "https://github.com/KMiri-rs/book"
edit-url-template = "https://github.com/KMiri-rs/book/edit/main/{path}"
additional-js = ["giscus.js"]
additional-css = ["theme/custom.css"]

[output.html.fold]
enable = true
level = 0

[preprocessor.spec]
command = "mdbook-spec"
