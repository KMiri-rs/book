[book]
authors = ["YOUR_NAME"]
language = "zh-CN"
src = "src"
title = "YOUR_SITE_TITLE"

[build]
build-dir = "public"

[output.html]
default-theme = "light"
git-repository-url = "https://github.com/kern-crates/mdbook-template"
edit-url-template = "https://github.com/kern-crates/mdbook-template/edit/main/{path}"
additional-js = ["giscus.js"]

[output.html.fold]
enable = true
level = 0
