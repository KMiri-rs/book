<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-labelledby="t d" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="15" fill="#222">
<title id="t">KMiri 多核支持的四层结构</title>
<desc id="d">从上到下是星绽内核、移植层、KMiri 虚拟多核硬件和 Miri 原有检查器。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#444"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2e7d32"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c62828"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<rect x="30" y="16" width="860" height="92" rx="8" fill="#f3e8fd" stroke="#8e5bc9" stroke-width="1.5"/>
<text x="50" y="46" font-size="17" font-weight="bold">① 星绽 OSTD 与测试：主流程照常运行</text><text x="50" y="74">从核启动流程、调度框架、CPU 本地变量、锁、原子操作、RCU</text><text x="50" y="96" font-size="13" fill="#555">测试只通过安全 Rust 和 OSTD 公开接口触发问题</text>
<line x1="460" y1="108" x2="460" y2="132" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="134" width="860" height="92" rx="8" fill="#fff8e1" stroke="#c99a2e" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="50" y="164" font-size="17" font-weight="bold">② 移植层 arch/miri：把硬件操作换成接口调用</text><text x="50" y="192">查 CPU 个数、启动从核、读硬件编号、设置 CPU 本地基址、复制 CPU 本地段</text><text x="50" y="214" font-size="13" fill="#555">每换一个内核，只需要重写这一层</text>
<line x1="440" y1="226" x2="440" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="330" y="244" font-size="13" fill="#555">kern_miri_* 接口</text>
<line x1="490" y1="250" x2="490" y2="228" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="500" y="244" font-size="13" fill="#555">从核从跳板函数开始执行</text>
<rect x="30" y="252" width="860" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="50" y="282" font-size="17" font-weight="bold">③ KMiri 新增：虚拟多核硬件（不认识任何内核的名字）</text>
<g fill="#fff" stroke="#7fb883"><rect x="50" y="298" width="190" height="88" rx="6"/><rect x="255" y="298" width="190" height="88" rx="6"/><rect x="460" y="298" width="190" height="88" rx="6"/><rect x="665" y="298" width="205" height="88" rx="6"/></g>
<g text-anchor="middle"><text x="145" y="326" font-weight="bold">CPU 槽位</text><text x="145" y="350" font-size="13">谁在哪个 CPU 上</text><text x="145" y="370" font-size="13">启动从核</text><text x="350" y="326" font-weight="bold">交错调度</text><text x="350" y="350" font-size="13">基本块末尾随机换</text><text x="350" y="370" font-size="13">自旋时立刻换</text><text x="555" y="326" font-weight="bold">先后规则</text><text x="555" y="350" font-size="13">启动、同核切换加边</text><text x="555" y="370" font-size="13">换 CPU 不加边</text><text x="767" y="326" font-weight="bold">每核内存</text><text x="767" y="350" font-size="13">CPU 本地变量副本</text><text x="767" y="370" font-size="13">惰性页的创建时刻</text></g>
<line x1="460" y1="402" x2="460" y2="426" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="428" width="860" height="76" rx="8" fill="#e0f4f7" stroke="#2b8a9e" stroke-width="1.5"/>
<text x="50" y="458" font-size="17" font-weight="bold">④ Miri 原有检查器：判定是否 UB，不增加新规则</text><text x="50" y="486">向量时钟数据竞争检测、Stacked Borrows / Tree Borrows、内存安全检查</text>
</svg>
