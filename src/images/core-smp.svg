<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="15" fill="#222">
<title id="t">普通 Miri 与 KMiri 的并发执行顺序</title>
<desc id="d">普通 Miri 在任意线程之间随机切换。KMiri 中每个 CPU 在任一时刻绑定一个线程，解释器在 CPU 之间随机切换；同一 CPU 上的线程只在内核调度时切换。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#444"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<g font-size="18" font-weight="bold" text-anchor="middle"><text x="200" y="34">普通 Miri</text><text x="660" y="34">KMiri</text></g>
<g stroke="#555" stroke-width="1.5">
<rect x="170" y="70" width="140" height="40" rx="4" fill="#dde8f4"/><rect x="170" y="140" width="140" height="40" rx="4" fill="#dde8f4"/><rect x="170" y="210" width="140" height="40" rx="4" fill="#dde8f4"/>
<rect x="480" y="80" width="100" height="40" rx="4" fill="#e2efda"/><rect x="480" y="190" width="100" height="40" rx="4" fill="#e2efda"/>
<rect x="620" y="80" width="110" height="40" rx="4" fill="#dde8f4"/><rect x="620" y="190" width="110" height="40" rx="4" fill="#dde8f4"/>
<rect x="780" y="80" width="100" height="40" rx="4" fill="#f2f2f2" stroke-dasharray="5 3"/>
</g>
<g text-anchor="middle"><text x="240" y="96">线程 1</text><text x="240" y="166">线程 2</text><text x="240" y="236">线程 3</text>
<text x="530" y="106">CPU 0</text><text x="530" y="216">CPU 1</text><text x="675" y="106">线程 1</text><text x="675" y="216">线程 2</text><text x="830" y="106" fill="#666">线程 3</text></g>
<g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M130,160 C150,160 150,90 168,90"/><line x1="130" y1="160" x2="168" y2="160"/><path d="M130,160 C150,160 150,230 168,230"/>
<path d="M440,155 C460,155 460,100 478,100"/><path d="M440,155 C460,155 460,210 478,210"/>
<path d="M730,92 C750,70 760,70 778,92" marker-start="url(#a)"/>
</g>
<g stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"><line x1="580" y1="100" x2="620" y2="100"/><line x1="580" y1="210" x2="620" y2="210"/></g>
<g text-anchor="end"><text x="120" y="155">随机切换</text><text x="430" y="150">随机切换</text><text x="430" y="172" font-size="13" fill="#555">CPU</text></g>
<text x="755" y="60" font-size="13" fill="#555" text-anchor="middle">内核调度</text>
<g font-size="13" fill="#555" text-anchor="middle"><text x="200" y="285">任意两个线程之间都可能切换</text><text x="660" y="275">CPU 之间随机切换；</text><text x="660" y="294">同一 CPU 上的线程只在内核调度时切换</text></g>
</svg>
